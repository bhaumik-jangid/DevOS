name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: devos_test
          POSTGRES_USER: devos_user
          POSTGRES_PASSWORD: devos_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/development.txt

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: devos_test
          DB_USER: devos_user
          DB_PASSWORD: devos_password
          DB_HOST: localhost
          DB_PORT: 5432
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          CSRF_TRUSTED_ORIGINS: http://localhost:3000
        run: |
          pytest apps/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

      - name: Run linter
        working-directory: backend
        run: flake8 apps/ --max-line-length=100 --exclude=migrations
