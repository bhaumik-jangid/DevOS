name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.added, 'backend/')
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploys automatically on push
        run: echo "Vercel connected to repo — deploys on push to main automatically"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          STATUS="${{ needs.deploy-backend.result }}"
          COMMIT="${{ github.sha }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          ACTOR="${{ github.actor }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="🚨"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"${EMOJI} <b>Deploy ${STATUS}</b>\\n\\nCommit: ${COMMIT:0:7}\\nMessage: ${MESSAGE}\\nBy: ${ACTOR}\",
              \"parse_mode\": \"HTML\"
            }"
