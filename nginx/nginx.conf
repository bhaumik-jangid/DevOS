# Run Nginx as a non-root user — security best practice
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Efficient file transfer
    sendfile on;
    keepalive_timeout 65;

    # Upstream blocks define the backend services by Docker service name
    # Docker's internal DNS resolves "backend" and "frontend" automatically
    upstream django {
        server backend:8000;
    }

    upstream nextjs {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Maximum upload size — increase if you allow file uploads
        client_max_body_size 20M;

        # Route all /api/* and /admin/* requests to Django
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django static files (CSS/JS for the Django admin panel)
        location /static/ {
            proxy_pass http://django;
        }

        # WebSocket support for Next.js hot reload in development
        location /_next/webpack-hmr {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # All other traffic goes to Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for Next.js streaming responses
            proxy_buffering off;
        }
    }
}